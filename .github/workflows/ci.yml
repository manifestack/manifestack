name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs the whole CI before it publishes.
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels the run for the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24, 26]
        include:
          - os: windows-latest
            node: 24
          - os: macos-latest
            node: 24
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # Generated copies in skills/ and hooks/ must match catalog/ and packages/core/.
      - run: node tools/sync.mjs --check
      - run: npm test

  validate:
    name: Skills, plugin and packaging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Agent Skills spec (skills-ref)
        run: |
          pip install skills-ref
          for dir in skills/*/; do agentskills validate "$dir"; done
      - name: Claude Code plugin
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate . --strict
      - name: skills CLI finds both skills
        run: |
          npx -y skills add ./ --list | tee skills-list.txt
          grep -q 'manifestack-guard' skills-list.txt
      # Packs the CLI as `npm publish` would and runs the tarball in an empty project.
      - name: npm package installs and works
        run: npm run smoke

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # On a pull request the same benchmark runs on the base branch, so the summary shows the change.
      - name: Measure the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add "$RUNNER_TEMP/base" "$BASE_SHA"
          node tools/bench.mjs all --root "$RUNNER_TEMP/base" --json > "$RUNNER_TEMP/base.json" || rm -f "$RUNNER_TEMP/base.json"
      # Tokens and speed against bench/budgets.json; the table goes to the job summary.
      - name: Benchmarks
        run: |
          compare=()
          if [ -f "$RUNNER_TEMP/base.json" ]; then compare=(--compare "$RUNNER_TEMP/base.json"); fi
          node tools/bench.mjs all --check --markdown "${compare[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"
