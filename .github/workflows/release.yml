name: Release

# Push a tag vX.Y.Z after bumping the version in packages/cli/package.json, packages/core/package.json,
# .claude-plugin/plugin.json and metadata.version in every SKILL.md (CI checks they agree).
on:
  push:
    tags: ['v*.*.*']

permissions: {}

jobs:
  # The full CI (every Node version, Windows, plugin and package checks) must pass before anything is published.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: write # GitHub release
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Tag matches the package version
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      # Trusted publishing (OIDC): no tokens. Set up on npmjs.com for release.yml, environment npm.
      - name: Publish to npm
        run: npm publish -w packages/cli --access public --provenance
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
