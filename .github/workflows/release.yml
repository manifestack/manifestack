name: Release

# Push a tag vX.Y.Z after bumping the version in packages/cli/package.json, packages/core/package.json,
# .claude-plugin/plugin.json and metadata.version in every SKILL.md (CI checks they agree).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Tag matches the package version
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - run: node tools/sync.mjs --check
      - run: npm test
      # Trusted publishing (OIDC) is the normal path. NPM_TOKEN is only for the very first publish,
      # before the package exists on npm and a trusted publisher can be set up; delete the secret after.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish -w packages/cli --access public --provenance
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
